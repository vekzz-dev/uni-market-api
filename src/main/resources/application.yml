# Configuración base de Uni Market API.
# Todo valor externo se inyecta por variables de entorno (12-factor); los defaults
# apuntan al entorno local y nunca contienen secretos reales.
spring:
  application:
    name: uni-market-api

  # Perfil por defecto para desarrollo local. Se sobreescribe con la variable
  # de entorno SPRING_PROFILES_ACTIVE o con --spring.profiles.active.
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unimarket}
    username: ${DB_USER:unimarket}
    password: ${DB_PASSWORD:unimarket}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es dueño del esquema (DBDD §6): Hibernate solo valida.
      ddl-auto: validate

  flyway:
    # Ubicaciones por defecto: classpath:db/migration.
    enabled: true

  servlet:
    multipart:
      # El contenedor acepta hasta 10 MB POR ARCHIVO para que la decisión de negocio (avatar 2 MB,
      # imágenes de anuncio 5 MB, R8) la tome la aplicación con su 422. El total de la petición
      # cubre 5 imágenes × 5 MB + campos (R8): sin este margen, subir 3+ imágenes válidas caería
      # en un 400 del contenedor antes de validar.
      max-file-size: 10MB
      max-request-size: 26MB

server:
  port: 8080

# Kernel de seguridad (SDD §8, D2): el secreto se inyecta solo por entorno (JWT_SECRETO),
# sin default inseguro. Si está vacío el decoder JWT no se crea y la app arranca sin
# validación de tokens (útil en dev/test; en producción es obligatorio).
app:
  seguridad:
    jwt:
      secreto: ${JWT_SECRETO:}
      ttl-acceso: 15m
    # Límite de tasa configurable (Q1/R13, N3): intentos por minuto y propósito.
    rate-limit:
      intentos-por-minuto: ${RATE_LIMIT_INTENTOS:5}
  # Correo transaccional (SDD §10, D12): `log` imprime el token en consola (dev);
  # `resend` envía vía API HTTP con RESEND_API_KEY y RESEND_REMITENTE (prod).
  notificaciones:
    proveedor: ${NOTIFICACIONES_PROVEEDOR:log}
    # Cooldown de reenvío de confirmación (PRD §5, N5).
    cooldown-reenvio: ${NOTIFICACIONES_COOLDOWN_REENVIO:2m}
    resend:
      api-key: ${RESEND_API_KEY:}
      remitente: ${RESEND_REMITENTE:no-reply@example.com}
  # Medios (SDD §10, D14/N8): filesystem en dev (datos de usuario, no config) y R2 en prod
  # (credenciales solo por entorno; URL pública r2.dev o dominio propio).
  media:
    proveedor: ${MEDIA_PROVEEDOR:filesystem}
    raiz: "${MEDIA_DIR:~/.uni-market}"
    avatar-max-bytes: 2097152
    tipos-avatar:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    # Límites de anuncios (R8): los aplica la aplicación con 422; el contenedor admite 10 MB/archivo.
    anuncio-max-imagenes: 5
    imagen-max-bytes: 5242880
    tipos-imagen:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    r2:
      endpoint: ${MEDIA_R2_ENDPOINT:}
      bucket: ${MEDIA_R2_BUCKET:}
      access-key-id: ${MEDIA_R2_ACCESS_KEY_ID:}
      secret-access-key: ${MEDIA_R2_SECRET_ACCESS_KEY:}
      url-publica: ${MEDIA_R2_URL_PUBLICA:}

# Pendiente de agregar cuando existan sus módulos (única fuente de verdad, SDD §10):
# - moderation: decisión de revisión vive en catalog; sin config propia aún.
