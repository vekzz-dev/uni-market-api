# Perfil DEV (default): todo local, cero dependencias externas.
# - Medios en filesystem local (D14).
# - Emails impresos en consola (el token de confirmación sale en el log).
# Los adaptadores siguen siendo sobreescribibles por variables de entorno.
app:
  media:
    # Overridable por entorno: un valor literal aquí GANA sobre el placeholder del
    # application.yml base y deja la variable inservible en el perfil dev.
    proveedor: ${MEDIA_PROVEEDOR:filesystem}
  notificaciones:
    proveedor: ${NOTIFICACIONES_PROVEEDOR:log}
  seguridad:
    cors:
      # Navegador en dev: cualquier puerto local (Vite 5173, CRA 3000, Hoppscotch…).
      origenes-permitidos: "http://localhost:*,http://127.0.0.1:*"
