# =============================================================================
# Uni Market — orquestación local.
#
#   Solo la BD (desarrollo con IntelliJ):   podman compose up -d postgres
#   Stack completo en contenedores:         podman compose up -d --build
#
# Requiere un archivo `.env` en la raíz (ignorado por git) con:
#   JWT_SECRETO=<32+ bytes>   →  printf 'JWT_SECRETO=%s\n' "$(openssl rand -base64 32)" > .env
# =============================================================================
services:
  postgres:
    # Calificada completa: podman no resuelve nombres cortos sin TTY (misma lección
    # que el Dockerfile). Variante alpine (oficial del proyecto Postgres): mismo major 18
    # y mismo layout de PGDATA (volumen en /var/lib/postgresql), ~35% menos de disco y
    # arranque más rápido. La imagen de PRODUCCIÓN de la API sí queda en temurin glibc
    # (decisión de reproducibilidad: musl no aporta aquí y añade superficie).
    image: docker.io/library/postgres:18-alpine
    container_name: unimarket-pg
    environment:
      POSTGRES_USER: unimarket
      POSTGRES_PASSWORD: unimarket
      POSTGRES_DB: unimarket
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 cambió su layout: PGDATA vive en /var/lib/postgresql/18/docker
      # y el VOLUME declarado es /var/lib/postgresql (no .../data).
      - unimarket-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimarket -d unimarket"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: unimarket-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el host es el nombre del servicio, no localhost.
      DB_URL: jdbc:postgresql://postgres:5432/unimarket
      DB_USER: unimarket
      DB_PASSWORD: unimarket
      JWT_SECRETO: ${JWT_SECRETO:?define JWT_SECRETO en .env — ver cabecera de este archivo}
      # Perfil Spring: dev por defecto (adaptadores locales). Para simular prod:
      #   SPRING_PROFILES_ACTIVE=prod podman compose up -d api
      # (prod es fail-fast: exige RESEND_API_KEY, claves de R2 y un DB_URL alcanzable).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Medios persistentes del contenedor (filesystem adapter, D14).
      MEDIA_DIR: /data/media
      # Correo: `log` (default, token en consola), `resend` o `resend+log` (local: envía y
      # además imprime el token). Estas variables NO se heredan solas desde .env: compose
      # solo pasa las que declara aquí.
      NOTIFICACIONES_PROVEEDOR: ${NOTIFICACIONES_PROVEEDOR:-log}
      NOTIFICACIONES_COOLDOWN_REENVIO: ${NOTIFICACIONES_COOLDOWN_REENVIO:-2m}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_REMITENTE: ${RESEND_REMITENTE:-no-reply@example.com}
      # Solo local: redirige TODOS los correos a una bandeja para probar la entrega real.
      NOTIFICACIONES_DESTINO_PRUEBA: ${NOTIFICACIONES_DESTINO_PRUEBA:-}
      RATE_LIMIT_INTENTOS: ${RATE_LIMIT_INTENTOS:-5}
    ports:
      - "8080:8080"
    volumes:
      - unimarket-media:/data/media

volumes:
  unimarket-pgdata:
  unimarket-media:
