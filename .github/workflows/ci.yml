name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `mvn verify` compila, ejecuta tests (incluye las guardas del contrato OpenAPI:
      # validez estructural con swagger-parser y prohibición de claves YAML duplicadas).
      - name: Build and verify
        run: mvn -B verify
