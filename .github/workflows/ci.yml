name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    # Pin del runner (no `ubuntu-latest`): reproducibilidad del build — el flip de
    # `latest` a una versión mayor futura no debe romper el CI sin aviso.
    # `ubuntu-slim` NO sirve aquí: es contenedor 1 vCPU sin Docker-in-Docker (Testcontainers).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `mvn verify` compila, ejecuta tests (incluye las guardas del contrato OpenAPI:
      # validez estructural con swagger-parser y prohibición de claves YAML duplicadas).
      - name: Build and verify
        run: mvn -B verify
